# ~/.config/wallust/wallust.toml
#
# Color extraction settings. Tweak these to taste.
backend = "wal"                    # <== wal : full, resized, wal, thumb, fastresize, kmeans 
color_space = "salience"           # <== lab : labmixed, lch, lchmixed, salience, lchansi
palette = "dark16"                 # <== dark16 : "dark16", "light16"i, "dark", "light", "hardauto", "harddark", "hardlight"
check_contrast = true
fallback_generator = "interpolate" # <== complementary : interpolate, complementary
# saturation = 60                    # <== previously blank # rages from 1 - 100

# Every entry here writes one generated file. "waybar" is a template that
# ships with wallust and outputs the palette as CSS custom properties
# (@color0.. @color15, @background, @foreground, @cursor).
[templates]
waybar = { template = "waybar", dst = "~/.config/waybar/colors.css" }
swaync = { template = "waybar", dst = "~/.config/swaync/colors.css" }
kitty = { template = "kitty", dst = "~/.config/kitty/current-theme.conf" }
nvim = { template = "nvim", dst = "~/.config/nvim/colors/wallust.lua" }
vicinae = { template = "vicinae", dst = "~/.local/share/vicinae/themes/wallust.toml" }
wlogout = { template = "wlogout", dst = "~/.config/wlogout/style.css" }

# Bonus: keep other tools in sync with the same wallpaper for free.
# Comment out any you don't use, or add more from
# https://codeberg.org/explosion-mental/wallust-templates
# hyprland = { template = "hyprland", dst = "~/.config/hypr/colors.conf" }
# rofi     = { template = "rofi",     dst = "~/.config/rofi/colors.rasi" }
# swaync   = { template = "waybar",   dst = "~/.config/swaync/colors.css" }
# kitty    = { template = "kitty",    dst = "~/.config/kitty/colors.conf" }

[hooks]
reload-waybar = "killall -9 waybar && waybar"
reload-swaync = "swaync-client -R && swaync-client -rs"
reload-kitty = "kill -SIGUSR1 $(pgrep -x kitty) 2>/dev/null || true"
reload-vicinae = "killall -9 vicinae-server && vicinae server &"


# Pallete Examples
# dark, dark16, darkcomp, darkcomp16, ansidark, ansidark16, harddark, harddark16, harddarkcomp, 
# harddarkcomp16, saliencedark, saliencedark16, saliencedarkbalanced, saliencedarkbalanced16, 
# saliencedarkdistributed, saliencedarkdistributed16, saliencedarklow, saliencedarklow16, 
# light, light16, lightcomp, lightcomp16, softdark, softdark16, softdarkcomp, softdarkcomp16, 
# softlight, softlight16, softlightcomp, softlightcomp16, saliencelight, saliencelight16, 
# saliencelightbalanced, saliencelightbalanced16, saliencelightdistributed, saliencelightdistributed16, 
# saliencelightlow, saliencelightlow16
